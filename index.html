<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>📚 Student Study Planner</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="logo">
        <span class="logo-icon">📚</span>
        <div>
          <h1>Study Planner</h1>
          <p>Manage your subjects & assignments</p>
        </div>
      </div>
      <div class="stats">
        <div class="stat-card">
          <span class="stat-value" id="totalCount">0</span>
          <span class="stat-label">Total</span>
        </div>
        <div class="stat-card pending">
          <span class="stat-value" id="pendingCount">0</span>
          <span class="stat-label">Pending</span>
        </div>
        <div class="stat-card completed">
          <span class="stat-value" id="completedCount">0</span>
          <span class="stat-label">Completed</span>
        </div>
      </div>
    </header>

    <!-- Form Section -->
    <section class="form-section">
      <h2 id="formTitle">➕ Add New Assignment</h2>
      <form id="assignmentForm">
        <input type="hidden" id="editId" />
        <div class="form-grid">
          <div class="input-group">
            <label>Subject</label>
            <input type="text" id="subject" placeholder="e.g., Web Technology" required />
          </div>
          <div class="input-group">
            <label>Assignment</label>
            <input type="text" id="assignment" placeholder="e.g., HTML Forms" required />
          </div>
          <div class="input-group">
            <label>Deadline</label>
            <input type="date" id="deadline" required />
          </div>
          <div class="input-group">
            <label>Status</label>
            <select id="status">
              <option value="Pending">Pending</option>
              <option value="In Progress">In Progress</option>
              <option value="Completed">Completed</option>
            </select>
          </div>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary" id="submitBtn">Add Assignment</button>
          <button type="button" class="btn btn-secondary" id="cancelBtn" style="display:none;">Cancel</button>
        </div>
      </form>
    </section>

    <!-- Controls -->
    <section class="controls">
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" placeholder="Search by subject or assignment..." />
      </div>
      <div class="filter-tabs" id="filterTabs">
        <button class="filter-btn active" data-filter="All">All</button>
        <button class="filter-btn" data-filter="Pending">Pending</button>
        <button class="filter-btn" data-filter="In Progress">In Progress</button>
        <button class="filter-btn" data-filter="Completed">Completed</button>
      </div>
    </section>

    <!-- Assignments Grid -->
    <section class="assignments-section">
      <div id="assignmentsList" class="assignments-grid"></div>
      <div id="emptyState" class="empty-state" style="display:none;">
        <span>📭</span>
        <h3>No assignments found</h3>
        <p>Add a new assignment to get started!</p>
      </div>
    </section>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="toast"></div>

  <script src="script.js"></script>
</body>
</html>
